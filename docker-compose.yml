version: "3.9"

services:
  php:
    build: .
    container_name: php_app
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devs_rn
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./meu_database.sql:/docker-entrypoint-initdb.d/meu_database.sql:ro
      

    
volumes:
  dbdata:
    